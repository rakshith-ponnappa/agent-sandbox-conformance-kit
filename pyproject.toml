[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-conformance-kit"
version = "0.1.0"
description = "Black-box conformance, network-policy and quota-edge test suite for AI agent code sandboxes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakshith Ponnappa" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sandbox-conformance = "sandbox_conformance.__main__:main"

[tool.setuptools.packages.find]
include = ["sandbox_conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
