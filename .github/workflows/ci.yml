name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Test
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lifecycle checks against local Docker
        run: python -m sandbox_conformance run --provider local-docker --only lifecycle --json conformance.json --md conformance.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-report
          path: |
            conformance.json
            conformance.md
          if-no-files-found: ignore
